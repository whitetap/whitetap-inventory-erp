<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an organization - Aviation ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <h1 class="h2 mb-3">Create your organization</h1>
                <p>Set up an organization and its first administrator account.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert {{ 'alert-danger' if category == 'error' else 'alert-success' }}" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="post" action="{{ url_for('signup') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="organization_name">Organization name</label>
                        <input class="form-control" id="organization_name" name="organization_name" maxlength="100" value="{{ organization_name|default('') }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Admin email</label>
                        <input class="form-control" id="email" name="email" type="email" maxlength="255" autocomplete="email" value="{{ email|default('') }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
                        <div class="form-text text-light">Use at least 12 characters.</div>
                    </div>
                    <button class="btn btn-primary" type="submit">Create organization</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
