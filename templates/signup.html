<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an organization - Aviation ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <h1 class="h2 mb-3">Create your organization</h1>
                <p>Set up an organization and its first administrator account.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert {{ 'alert-danger' if category == 'error' else 'alert-success' }}" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                {% include '_signup_form.html' %}
            </div>
        </div>
    </main>
</body>
</html>
