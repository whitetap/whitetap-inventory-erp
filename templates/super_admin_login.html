<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System owner sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 28rem">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">System owner sign in</h1>
      <p class="text-secondary">Manage organization access.</p>
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-danger" role="alert">{{ message }}</div>
      {% endfor %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="password">Owner password</label>
        <input class="form-control mb-3" id="password" type="password" name="password" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
